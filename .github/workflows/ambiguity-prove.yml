name: Ambiguity proof

# The bounded search in `ambiguity-search.yml` answers "no ambiguous sentence
# of at most N tokens". This workflow runs the other mode: `ambiguity prove`
# abstracts GLR stacks to their top K states, which makes the configuration
# space finite, so a clean run is a proof for inputs of every length.
#
# It is deliberately not a pull request gate. "Not proven" is an expected,
# permanent possibility — unambiguity is undecidable, and the grammar's own
# policy allows tracked open obligations — so a required check on this would
# block merges for a verdict that carries no new information. The weekly run
# is the regression signal, and it fails only when a concrete ambiguous
# sentence is found, which is a real bug.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to prove
        required: true
        default: main
        type: string
      level:
        # Stacks are abstracted to their top LEVEL states, and the search runs
        # over pairs of abstract stacks, so cost grows exponentially in this
        # number while precision — the chance of avoiding a spurious candidate
        # — grows with it. There is no level that is correct in general; 3 is
        # the level the README uses.
        description: Proof level K (top-K stack abstraction)
        required: true
        default: "3"
        type: string
      profile:
        description: Profile for the bounded concretization search
        required: true
        default: quick
        type: choice
        options:
          - quick
          - general
          - deep-function-body
      timeout:
        # Each search phase gets this in full: the abstract proof runs under
        # its own deadline, and the concretization search that may follow
        # starts a fresh one. Budget the job for twice the value chosen, on
        # top of checkout, Devbox, the opam bootstrap and the build — 30m is
        # the largest offered, so the 60-minute job cap holds.
        description: Timeout per search phase
        required: true
        default: 15m
        type: choice
        options:
          - 5m
          - 15m
          - 30m
      strict:
        description: Fail the job on "not proven", not only on a found ambiguity
        required: false
        default: false
        type: boolean

  schedule:
    # Mondays at 04:00 UTC, against the default branch.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ambiguity-prove-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove level ${{ inputs.level || '3' }} on ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-latest
    # Both search phases obey --timeout, so the tool now bounds itself: at the
    # largest offered value the two phases total 60 minutes. This cap is the
    # backstop around them and has to clear that total plus checkout, Devbox,
    # the opam bootstrap and the build, because a job killed here prints no
    # verdict line at all and the report the verdict is read from is never
    # written — turning an honest "not proven" into a broken run.
    timeout-minutes: 75
    env:
      # Public ubuntu-latest runners provide four CPUs and 16 GB RAM:
      # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      # In proof mode the derived frontier limit becomes the abstract pair
      # limit, so this budget is what decides whether a level completes or
      # overflows; the worker count only affects the concretization search.
      AMBIGUITY_MEMORY_MB: "10240"
      AMBIGUITY_MAX_FRONTIER_RATIO: "1.0"
      AMBIGUITY_JOBS: "4"
      AMBIGUITY_MENHIR: menhir
      REPORT: reports/actions/prove-${{ github.run_id }}-${{ github.run_attempt }}.txt

    steps:
      - name: Check out requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          persist-credentials: false

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: true

      # Every command below is handed to `devbox run` as a single word followed
      # by plain arguments. Devbox quotes each argument and `eval`s the result,
      # so a multi-line shell snippet passed this way is mangled into an escape
      # sequence rather than run; the devbox init hook already provisions the
      # opam switch and puts dev/bin and the switch on PATH, so no wrapper shell
      # is needed in the first place.
      - name: Install OCaml dependencies
        shell: bash
        run: |
          set -euo pipefail
          devbox run -- dev/bin/bootstrap-toolchain

      - name: Build ambiguity finder
        shell: bash
        run: |
          set -euo pipefail
          devbox run -- dune build tools/ambiguity_search.exe

      - name: Run unambiguity proof
        id: proof
        shell: bash
        env:
          LEVEL: ${{ inputs.level || '3' }}
          PROFILE: ${{ inputs.profile || 'quick' }}
          SEARCH_TIMEOUT: ${{ inputs.timeout || '15m' }}
          WITNESSES: "50"
        run: |
          set -euo pipefail
          devbox run -- .github/scripts/ambiguity-prove

      - name: Show report in job log
        if: always()
        shell: bash
        run: |
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT"
          else
            echo "No report was produced."
          fi

      # Separate from the run step so a proof that finished and a verdict that
      # could not be read fail at distinguishable points. It is skipped when the
      # proof step never ran, so a checkout or toolchain failure is not also
      # reported as a missing verdict.
      - name: Decide the verdict
        if: always() && steps.proof.outcome != 'skipped'
        shell: bash
        env:
          STRICT: ${{ inputs.strict || false }}
        run: .github/scripts/ambiguity-verdict

      - name: Upload proof report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ambiguity-prove-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/actions/
          if-no-files-found: warn
          retention-days: 30
