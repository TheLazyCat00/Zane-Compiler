name: Ambiguity precision sweep

# `ambiguity-prove.yml` asks whether one level proves the grammar. This asks
# the question a single level cannot answer: when a level does not prove it,
# is the blind spot bounded — it keeps its shape and closes once the retained
# stack is wide enough — or unbounded, defeating every window by taking a
# longer sentence?
#
# The two demand opposite responses. A bounded spot is worth refining the
# abstraction for, whether globally or only along a counterexample's chain; an
# unbounded one never closes at any level and belongs in a written transience
# argument instead. Sweeping the level and watching the accepting-pair count is
# what separates them.
#
# It is a diagnostic, not a gate, and deliberately has no schedule: it answers
# a question somebody is asking, and the answer does not change until the
# grammar does.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to sweep
        required: true
        default: main
        type: string
      grammar:
        # Zane's own grammar takes about ten minutes at level 2 and far longer
        # at level 3, so the levels where a threshold theory is confirmed or
        # killed are out of reach on it. A slice around one conflict sweeps in
        # seconds and is what makes the question answerable at all.
        description: Repository-relative path to the .mly grammar to sweep
        required: true
        default: tools/grammars/verb_suffix_vs_enum_map.mly
        type: string
      levels:
        # Cost grows roughly an order of magnitude per level, so a wide range
        # is only sensible on a small grammar. The sweep stops at the first
        # level that proves, since every wider window proves too.
        description: Levels to sweep, e.g. 1-8 or 2,4,6
        required: true
        default: "1-8"
        type: string
      level_timeout:
        # Per level, not per run: the job's own cap below has to cover this
        # multiplied by the number of levels swept.
        description: Seconds allowed for each level
        required: true
        default: "600"
        type: choice
        options:
          - "60"
          - "300"
          - "600"
          - "1800"
      tokens:
        description: Token bound for the concretization search
        required: false
        default: "12"
        type: string

permissions:
  contents: read

concurrency:
  group: ambiguity-sweep-${{ inputs.ref }}-${{ inputs.grammar }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep ${{ inputs.grammar }} over levels ${{ inputs.levels }}
    runs-on: ubuntu-latest
    # The sweep bounds itself per level, so the worst case is the per-level
    # timeout times the number of levels. This cap is the backstop around that
    # total plus checkout, Devbox, the opam bootstrap and the build. A job
    # killed here writes no reading into the report, turning an honest
    # "unbounded" or "inconclusive" into a broken run — the same failure mode
    # the proof workflow's cap exists to prevent.
    #
    # At the largest offered per-level timeout an eight-level sweep would need
    # four hours, which no grammar small enough to sweep that wide will ever
    # approach; the cap covers it rather than assuming it.
    timeout-minutes: 260
    env:
      # Public ubuntu-latest runners provide four CPUs and 16 GB RAM:
      # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      # A sweep must not confuse an under-resourced level with an imprecise
      # one, so the pair budget is set high enough that a level which does not
      # prove has failed on precision rather than on memory.
      AMBIGUITY_MEMORY_MB: "10240"
      AMBIGUITY_MAX_FRONTIER_RATIO: "1.0"
      AMBIGUITY_JOBS: "1"
      AMBIGUITY_MENHIR: menhir
      REPORT: reports/actions/sweep-${{ github.run_id }}-${{ github.run_attempt }}.txt

    steps:
      - name: Check out requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: true

      # Every command below is handed to `devbox run` as a single word followed
      # by plain arguments. Devbox quotes each argument and `eval`s the result,
      # so a multi-line shell snippet passed this way is mangled into an escape
      # sequence rather than run; the devbox init hook already provisions the
      # opam switch and puts dev/bin and the switch on PATH, so no wrapper shell
      # is needed in the first place.
      - name: Install OCaml dependencies
        shell: bash
        run: |
          set -euo pipefail
          devbox run -- dev/bin/bootstrap-toolchain

      - name: Build ambiguity finder
        shell: bash
        run: |
          set -euo pipefail
          devbox run -- dune build tools/ambiguity_search.exe

      - name: Sweep the abstraction level
        id: sweep
        shell: bash
        env:
          GRAMMAR: ${{ inputs.grammar }}
          LEVELS: ${{ inputs.levels }}
          LEVEL_TIMEOUT: ${{ inputs.level_timeout }}
          SWEEP_TOKENS: ${{ inputs.tokens || '12' }}
        run: |
          set -euo pipefail
          devbox run -- .github/scripts/ambiguity-sweep

      # Separate from the sweep step so a table that was produced and a table
      # that could not be read fail at distinguishable points, and so the rows
      # that did finish are visible even when a later level killed the run.
      - name: Show report in job log
        if: always()
        shell: bash
        run: |
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT"
          else
            echo "No report was produced."
          fi

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ambiguity-sweep-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/actions/
          if-no-files-found: warn
          retention-days: 30
